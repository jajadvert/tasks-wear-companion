name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build wear + phone APKs
        run: ./gradlew --no-daemon :wear:assembleDebug :phone:assembleDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: |
            wear/build/outputs/apk/debug/*.apk
            phone/build/outputs/apk/debug/*.apk
